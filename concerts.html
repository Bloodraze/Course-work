<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bloodraze | Official site & shop</title>
        <link rel="stylesheet" href="src/css/style.css">
        <link rel="stylesheet" href="src/css/concerts.css">
        <link rel="icon" type="image/png" href="src/img/icons/favicon/favicon.png">
    </head>
    <body>
        <header class="header">
            <div class="header__logo">
                <a href="index.html">
                    <img src="src/img/bloodraze_logo.png" alt="Bloodraze">
                </a>
            </div>
            <nav class="header__nav">
                <a href="shop.html" class="header__link">Мерч</a>
                <a href="concerts.html" class="header__link">Концерты</a>
                <div class="header__dropdown">
                    <a href="music.html" class="header__link">
                        Музыка
                    </a>
                    <div class="header__dropdown-menu">
                        <a href="music.html#popular">Популярное</a>
                        <a href="music.html#albums">Альбомы</a>
                    </div>
                </div>
                <a href="about.html" class="header__link">О нас</a>
            </nav>
            <div class="header__actions">
                <a href="shop.html" class="header__icon" aria-label="Корзина">
                    <img src="src/img/icons/shopping-cart.svg" alt="">
                </a>
                <a href="account.html" class="header__icon" aria-label="Личный кабинет">
                    <img src="src/img/icons/user.svg" alt="">
                </a>
                <div class="header__language">
                    <button class="header__language-button" type="button">
                        <img src="src/img/icons/flags/russia.svg" alt="">
                        <span>RU</span>
                    </button>

                    <div class="header__language-menu">
                        <button type="button" data-lang="ru">
                            <img src="src/img/icons/flags/russia.svg" alt="">
                            Русский
                        </button>
                        <button type="button" data-lang="en">
                            <span class="header__english-flags">
                                <img src="src/img/icons/flags/uk.svg" alt="">
                                <img src="src/img/icons/flags/usa.svg" alt="">
                            </span>
                            English
                        </button>
                    </div>
                </div>
            </div>
        </header>
    </body>
</html>
